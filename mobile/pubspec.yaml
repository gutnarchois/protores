name: protores
description: Turnos del PAE de la Institución Educativa Cristóbal Colón, Mariano Ramos.
publish_to: none
version: 0.3.0+4
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^7.4.2
  http: ^1.5.0
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/protores-logo.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/images/protores-logo.png
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 24
